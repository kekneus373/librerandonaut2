plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.github.librerandonaut.librerandonaut'
    compileSdk 37

    defaultConfig {
        applicationId "com.github.librerandonaut.librerandonaut"
        minSdk 23
        //noinspection OldTargetApi
        targetSdk 33
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            optimization {
                enable = true // Enables code and resource optimizations.
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /* implementation fileTree(include: ['*.jar'], dir: 'libs') */

    // Final version with API 21/22 support (1.7.0+ bumped minSdk to 23)
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Final version with API 21/22 support (1.12.0+ bumped minSdk to 23)
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.11.0'

    // ConstraintLayout 2.2.x still supports API 21+
    //noinspection GradleDependency
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Pure Java/Kotlin library with broad backward compatibility
    //noinspection GradleDependency
    //implementation 'com.google.code.gson:gson:2.11.0'
}